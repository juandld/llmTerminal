<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Claude Re-Auth</title>
<style>
  :root{--bg:#111;--surface:#1a1a1a;--surface2:#222;--border:#333;--text:#e0e0e0;--dim:#888;--accent:#00d4ff;--green:#4ecca3;--red:#e94560;--mono:'SF Mono','Fira Code',monospace}
  *{box-sizing:border-box}
  body{font-family:var(--mono);background:var(--bg);color:var(--text);margin:0;padding:24px 18px;max-width:560px;margin:0 auto;line-height:1.5}
  h1{font-size:18px;color:var(--accent);margin:0 0 4px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:20px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
  .status{font-size:13px;padding:10px 12px;border-radius:8px;margin-bottom:16px}
  .status.expired{background:rgba(233,69,96,.1);border:1px solid var(--red);color:var(--red)}
  .status.ok{background:rgba(78,204,163,.1);border:1px solid var(--green);color:var(--green)}
  .step{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin-bottom:8px;font-weight:600}
  button{width:100%;background:var(--accent);color:#000;border:none;border-radius:10px;padding:14px;font-family:var(--mono);font-size:14px;font-weight:600;cursor:pointer;min-height:50px;-webkit-tap-highlight-color:transparent}
  button:disabled{opacity:.5;cursor:default}
  button.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
  a.authlink{display:block;background:var(--surface2);border:1px solid var(--accent);color:var(--accent);text-decoration:none;padding:14px;border-radius:10px;text-align:center;font-size:14px;font-weight:600;margin-bottom:12px;word-break:break-all;min-height:50px}
  input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:14px;border-radius:10px;font-family:var(--mono);font-size:15px;margin-bottom:12px;min-height:50px;outline:none}
  input:focus{border-color:var(--accent)}
  .msg{font-size:13px;padding:10px 12px;border-radius:8px;margin-top:12px;white-space:pre-wrap;word-break:break-word}
  .msg.err{background:rgba(233,69,96,.1);border:1px solid var(--red);color:var(--red)}
  .msg.ok{background:rgba(78,204,163,.1);border:1px solid var(--green);color:var(--green)}
  .hidden{display:none}
  .spin{display:inline-block;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
  .hint{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.5}
</style>
</head>
<body>
  <h1>Claude Code Re-Auth</h1>
  <div class="sub">Renew the VPS auth token from your browser — no SSH needed.</div>

  <div id="statusBox" class="status">checking…</div>

  <div class="card">
    <div id="step1">
      <div class="step">Step 1 — Start</div>
      <button id="startBtn" onclick="start()">Begin re-authentication</button>
      <div class="hint">Spawns <code>claude setup-token</code> on the VPS and fetches your sign-in link.</div>
    </div>

    <div id="step2" class="hidden">
      <div class="step">Step 2 — Sign in</div>
      <a id="authLink" class="authlink" href="#" target="_blank" rel="noopener">Open sign-in page ↗</a>
      <div class="hint">Opens claude.com. Approve, then copy the code it gives you.</div>
    </div>

    <div id="step3" class="hidden">
      <div class="step">Step 3 — Paste the code</div>
      <input id="codeInput" type="text" placeholder="Paste authorization code" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="submitBtn" onclick="submit()">Finish &amp; save token</button>
    </div>

    <div id="msg" class="msg hidden"></div>
  </div>

<script>
const B = location.pathname.replace(/\/[^/]*$/, "");  // strip filename -> /terminal
function api(p){ return B + p; }
function show(id){ document.getElementById(id).classList.remove("hidden"); }
function hide(id){ document.getElementById(id).classList.add("hidden"); }
function setMsg(text, kind){ const m=document.getElementById("msg"); m.textContent=text; m.className="msg "+(kind||""); if(text) m.classList.remove("hidden"); else m.classList.add("hidden"); }

async function refreshStatus(){
  try{
    const r = await fetch(api("/api/claude-auth/status"));
    const d = await r.json();
    const box = document.getElementById("statusBox");
    if(d.expired){
      box.className="status expired";
      box.textContent = d.expiresAt ? ("Token EXPIRED ("+new Date(d.expiresAt).toUTCString()+"). Chats are 401ing.") : "No valid token. Chats are 401ing.";
    }else{
      box.className="status ok";
      box.textContent = "Token valid until "+new Date(d.expiresAt).toUTCString()+(d.hasRefresh?"":" (no refresh — will need renewal again).");
    }
  }catch(e){ document.getElementById("statusBox").textContent="status check failed: "+e.message; }
}

async function start(){
  const b=document.getElementById("startBtn");
  b.disabled=true; b.innerHTML='<span class="spin">⟳</span> Starting…';
  setMsg("","");
  try{
    const r = await fetch(api("/api/claude-auth/start"), {method:"POST", headers:{"Content-Type":"application/json"}, body:"{}"});
    const d = await r.json();
    if(!d.ok){ setMsg("Couldn't start: "+(d.error||"unknown")+(d.tail?("\n"+d.tail):""), "err"); b.disabled=false; b.textContent="Begin re-authentication"; return; }
    document.getElementById("authLink").href = d.url;
    hide("step1"); show("step2"); show("step3");
    document.getElementById("codeInput").focus();
  }catch(e){ setMsg("Start failed: "+e.message,"err"); b.disabled=false; b.textContent="Begin re-authentication"; }
}

async function submit(){
  const code = document.getElementById("codeInput").value.trim();
  if(!code){ setMsg("Paste the code first.","err"); return; }
  const b=document.getElementById("submitBtn");
  b.disabled=true; b.innerHTML='<span class="spin">⟳</span> Finalizing…';
  setMsg("","");
  try{
    const r = await fetch(api("/api/claude-auth/submit"), {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({code})});
    const d = await r.json();
    if(d.ok){
      setMsg("✓ Token saved. Valid until "+new Date(d.expiresAt).toUTCString()+". Your chats work again — reload the terminal.","ok");
      hide("step3");
      refreshStatus();
    }else{
      setMsg("Failed: "+(d.error||"unknown")+(d.tail?("\n…"+d.tail):""), "err");
      b.disabled=false; b.textContent="Finish & save token";
    }
  }catch(e){ setMsg("Submit failed: "+e.message,"err"); b.disabled=false; b.textContent="Finish & save token"; }
}

refreshStatus();
</script>
</body>
</html>
