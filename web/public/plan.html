<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Harness build progress</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1d2028;
    --border: #262a34;
    --fg: #e6e8ec;
    --muted: #8a8f9c;
    --link: #6ea8fe;
    --shipped: #35c46b;
    --decided: #9b7ee8;
    --in-progress: #f0b429;
    --deferred: #7c8391;
    --todo: #4d8cf0;
    --live: #2ecc71;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 2;
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: 0.2px; }
  .live-dot {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    padding: 3px 8px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--border);
    cursor: default;
  }
  .live-dot .pip {
    width: 8px; height: 8px; border-radius: 50%;
    background: #3b3f4a;
    box-shadow: none;
  }
  .live-dot.is-live .pip {
    background: var(--live);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(46,204,113, 0.65); }
    70%  { box-shadow: 0 0 0 7px rgba(46,204,113, 0); }
    100% { box-shadow: 0 0 0 0 rgba(46,204,113, 0); }
  }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 320px;
    gap: 16px;
    padding: 16px;
    max-width: 1080px;
    margin: 0 auto;
  }
  @media (max-width: 780px) {
    main { grid-template-columns: 1fr; }
  }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    min-width: 0;
  }
  section h2 {
    margin: 0 0 10px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.6px;
    text-transform: uppercase;
  }
  .slot {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 4px;
    border-top: 1px solid var(--border);
  }
  .slot:first-of-type { border-top: 0; }
  .slot .num {
    flex: 0 0 auto;
    width: 26px;
    text-align: right;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    padding-top: 2px;
  }
  .slot .body { flex: 1 1 auto; min-width: 0; }
  .slot .title { font-weight: 500; }
  .slot .blurb {
    margin-top: 3px;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.4;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
  }
  .badge {
    flex: 0 0 auto;
    display: inline-block;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 3px 8px;
    border-radius: 6px;
    background: #1f2431;
    color: var(--muted);
    align-self: flex-start;
    margin-top: 1px;
  }
  .badge.shipped     { background: rgba(53,196,107,0.15); color: var(--shipped); }
  .badge.decided     { background: rgba(155,126,232,0.15); color: var(--decided); }
  .badge.in-progress { background: rgba(240,180,41,0.15); color: var(--in-progress); }
  .badge.deferred    { background: rgba(124,131,145,0.18); color: var(--deferred); }
  .badge.todo        { background: rgba(77,140,240,0.15); color: var(--todo); }
  .log-entry {
    padding: 8px 4px;
    border-top: 1px solid var(--border);
    font-size: 12.5px;
    line-height: 1.45;
  }
  .log-entry:first-of-type { border-top: 0; }
  .log-entry .date {
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .log-entry .text {
    margin-top: 3px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
  }
  .stat-line {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .stat-line b { color: var(--fg); font-weight: 600; }
  .active-list {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    padding: 0;
    list-style: none;
  }
  .active-list li {
    padding: 4px 0;
    border-top: 1px dashed var(--border);
  }
  .active-list li:first-child { border-top: 0; }
  .active-list .proj {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--panel-2);
    color: var(--fg);
    font-size: 11px;
    margin-right: 6px;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .updated {
    font-size: 11px;
    color: var(--muted);
    margin-left: auto;
  }
  .empty { color: var(--muted); font-size: 12px; padding: 6px 0; }
</style>
</head>
<body>

<header>
  <h1>Harness build progress</h1>
  <span id="live" class="live-dot" title="No active work">
    <span class="pip"></span>
    <span class="label">idle</span>
  </span>
  <span class="updated" id="updated"></span>
</header>

<main>
  <section id="slots-section">
    <h2>Slots</h2>
    <div class="stat-line" id="counts"></div>
    <div id="slots"><div class="empty">Loading…</div></div>
  </section>
  <section>
    <h2>Recent progress</h2>
    <div id="log"><div class="empty">Loading…</div></div>
    <h2 style="margin-top:16px">Active now</h2>
    <ul id="active" class="active-list"><li class="empty">nothing running</li></ul>
  </section>
</main>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const STATES = ["shipped", "decided", "in-progress", "deferred", "todo"];

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => (
    { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]
  )); }

  function fmtRelDate(mtimeMs) {
    if (!mtimeMs) return "";
    const d = new Date(mtimeMs);
    const now = Date.now();
    const diff = Math.max(0, now - mtimeMs);
    if (diff < 60_000) return "just now";
    if (diff < 3600_000) return Math.floor(diff / 60_000) + "m ago";
    if (diff < 86400_000) return Math.floor(diff / 3600_000) + "h ago";
    return d.toISOString().slice(0, 10);
  }

  async function loadPlan() {
    try {
      const r = await fetch("/api/harness-plan", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      renderPlan(data);
    } catch (e) {
      $("slots").innerHTML = '<div class="empty">Plan fetch failed: ' + esc(e.message) + "</div>";
    }
  }

  function renderPlan(data) {
    const counts = { shipped: 0, decided: 0, "in-progress": 0, deferred: 0, todo: 0 };
    for (const s of data.slots) counts[s.state] = (counts[s.state] || 0) + 1;

    $("counts").innerHTML = STATES.map(st => (
      '<span><b>' + counts[st] + '</b> ' + st + '</span>'
    )).join('');

    $("slots").innerHTML = data.slots.map(s => (
      '<div class="slot">' +
        '<div class="num">' + s.num + '.</div>' +
        '<div class="body">' +
          '<div class="title">' + esc(s.title) + '</div>' +
          (s.blurb ? '<div class="blurb">' + esc(s.blurb) + '</div>' : '') +
        '</div>' +
        '<span class="badge ' + s.state + '">' + s.state + '</span>' +
      '</div>'
    )).join("");

    const log = (data.progressLog || []).slice(0, 10);
    if (log.length === 0) {
      $("log").innerHTML = '<div class="empty">no entries yet</div>';
    } else {
      $("log").innerHTML = log.map(e => (
        '<div class="log-entry">' +
          '<div class="date">' + esc(e.date) + '</div>' +
          '<div class="text">' + esc(e.text) + '</div>' +
        '</div>'
      )).join("");
    }

    $("updated").textContent = "plan updated " + fmtRelDate(data.updated_at) +
      (data.cached ? " · cached" : "");
  }

  async function loadActivity() {
    try {
      const r = await fetch("/api/activity", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const data = await r.json();
      renderActivity(data);
    } catch (e) {
      // Silent — the dot goes back to idle.
      renderActivity({ count: 0, sessions: [] });
    }
  }

  function renderActivity(data) {
    const dot = $("live");
    const label = dot.querySelector(".label");
    if (data.count > 0) {
      dot.classList.add("is-live");
      label.textContent = data.count === 1 ? "1 active" : (data.count + " active");
      const tt = data.sessions.map(s =>
        (s.project || "unknown") + ": " + (s.title || s.id.slice(0, 8))
      ).join(" · ") || "active";
      dot.title = tt;
    } else {
      dot.classList.remove("is-live");
      label.textContent = "idle";
      dot.title = "No active work";
    }
    const list = $("active");
    if (data.count === 0) {
      list.innerHTML = '<li class="empty">nothing running</li>';
    } else {
      list.innerHTML = data.sessions.map(s => (
        '<li>' +
          '<span class="proj">' + esc(s.project || "?") + '</span>' +
          esc(s.title || s.id.slice(0, 8)) +
        '</li>'
      )).join("");
    }
  }

  loadPlan();
  loadActivity();
  setInterval(loadPlan, 60_000);
  setInterval(loadActivity, 5_000);
})();
</script>
</body>
</html>
