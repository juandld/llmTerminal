<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>llmTerminal</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- File preview modal -->
<div id="file-modal" role="dialog" aria-modal="true">
  <div class="fm-bar">
    <span class="fm-icon" id="fm-icon">📄</span>
    <span class="fm-title" id="fm-title">File</span>
    <div class="fm-actions">
      <a class="fm-btn" id="fm-open-tab" target="_blank" rel="noopener noreferrer">↗ New tab</a>
      <button class="fm-btn close" onclick="closeFileModal()" title="Close (Esc)">&times;</button>
    </div>
  </div>
  <div class="fm-body" id="fm-body">
    <div class="fm-overlay" onclick="closeFileModal()"></div>
  </div>
</div>



<div class="sidebar" id="sidebar">
  <div class="sb-head"><h1>llmTerminal</h1><button class="hide-mobile" onclick="toggleSB()">&times;</button></div>
  <div class="sb-ctrl">
    <input id="sbSearch" type="search" placeholder="🔍 Search sessions" autocomplete="off" />
    <button id="newSessionBtn" type="button">+ New Session</button>
  </div>
  <div class="sb-list" id="sbList"></div>
</div>

<div class="main">
  <div class="topbar">
    <div class="topbar-nav">
      <button class="menu-btn" onclick="toggleSB()" title="Sessions">&#9776;</button>
      <span class="badge" id="badge">-</span>
      <button class="topbar-star" id="starBtn" onclick="toggleSessionStar()" title="Star — keeps this chat at high priority in the sidebar" aria-label="Star this chat">☆</button>
      <a href="/" class="app-btn" id="appBtn">App</a>
      <button class="topbar-att hide-mobile" id="topbarAtt" onclick="nextAttentionSession()" title="Next chat needing attention"><span class="topbar-att-icon" id="topbarAttIcon"></span><span class="topbar-att-text" id="topbarAttText">All clear</span></button>
      <a class="browser-btn off" id="browserBtn" title="No browser active" target="_blank" rel="noopener noreferrer" onclick="return handleBrowserClick(event)"><span class="browser-dot"></span><span class="btn-icon">🌐</span><span class="browser-url" id="browserUrl"></span></a>
      <button class="files-btn topbar-collapsible" id="filesBtn" onclick="toggleDrawer()"><span class="btn-icon">◳</span><span class="btn-label">Files</span><span class="badge-count" id="filesBadge" style="display:none">0</span></button>
      <button id="modelPickerBtn" class="win95-trigger model-pick-btn hide-mobile" type="button" onclick="toggleModelMenu(event)" title="Model for this session" aria-haspopup="true" aria-expanded="false">
        <span id="modelPickLabel">Opus 4.8 · max</span>
        <span class="win95-chev" aria-hidden="true">▼</span>
      </button>
      <button class="topbar-btn topbar-collapsible" id="tasksBtn" title="Task board" onclick="toggleTaskBoard()"><span class="btn-icon">▦</span><span class="btn-label">Tasks</span><span class="badge-count" id="tasksBadge" style="display:none">0</span></button>
      <button class="topbar-btn topbar-collapsible" id="jobsBtn" title="Long-running jobs" onclick="toggleJobs()"><span class="btn-icon">⚙</span><span class="btn-label">Jobs</span></button>
      <button class="topbar-btn topbar-collapsible" id="decisionsBtn" title="Decision timeline / tree" onclick="toggleDecisionsDrawer()"><span class="btn-icon">⌥</span><span class="btn-label">Decisions</span><span class="badge-count" id="decisionsBadge" style="display:none">0</span></button>
      <button class="topbar-btn topbar-collapsible" id="searchBtn" title="Search (Cmd+F)" onclick="toggleChatSearch()"><span class="btn-icon">⌕</span><span class="btn-label">Search</span></button>
      <button class="topbar-btn topbar-collapsible" id="summaryBtn" title="Session summary" onclick="toggleSummary()"><span class="btn-icon">Σ</span><span class="btn-label">Summary</span></button>
      <div class="topbar-overflow" id="topbarOverflow">
        <button class="topbar-overflow-btn" id="overflowBtn" onclick="toggleOverflowMenu()" title="More options"><span class="overflow-dot"></span>⋮</button>
        <div class="topbar-overflow-menu" id="overflowMenu">
          <a id="omBrowserBtn" target="_blank" rel="noopener" style="display:none" onclick="closeOverflowMenu()"><span class="om-dot" id="omBrowserDot"></span><span>🌐 Browser</span><span class="om-url" id="omBrowserUrl"></span></a>
          <button data-om="files" onclick="toggleDrawer();closeOverflowMenu()">◳ Files<span class="badge-count" id="filesBadgeMobile" style="display:none;margin-left:auto;background:var(--accent);color:#000;font-size:9px;padding:1px 5px;border-radius:8px">0</span></button>
          <button data-om="tasks" onclick="toggleTaskBoard();closeOverflowMenu()">▦ Tasks<span class="badge-count" id="tasksBadgeMobile" style="display:none;margin-left:auto;background:var(--accent);color:#000;font-size:9px;padding:1px 5px;border-radius:8px">0</span></button>
          <button data-om="jobs" onclick="toggleJobs();closeOverflowMenu()">⚙ Jobs</button>
          <button data-om="decisions" onclick="toggleDecisionsDrawer();closeOverflowMenu()">⌥ Decisions<span class="badge-count" id="decisionsBadgeMobile" style="display:none;margin-left:auto;background:var(--accent);color:#000;font-size:9px;padding:1px 5px;border-radius:8px">0</span></button>
          <button data-om="search" onclick="toggleChatSearch();closeOverflowMenu()">⌕ Search</button>
          <button data-om="summary" onclick="toggleSummary();closeOverflowMenu()">Σ Summary</button>
          <a data-om="app" href="/" onclick="closeOverflowMenu()" style="color:var(--dim)">↗ App</a>
          <div data-om="model" class="om-model-row"><span style="color:var(--dim);font-size:13px">Model</span><button id="omModelPickerBtn" class="win95-trigger" type="button" onclick="toggleModelMenu(event)" style="flex:1;justify-content:flex-start" aria-haspopup="true" aria-expanded="false"><span id="omModelPickLabel">Opus 4.8 · max</span><span class="win95-chev" style="margin-left:auto" aria-hidden="true">▼</span></button></div>
        </div>
      </div>
    </div>
    <div class="dot-status" id="ds"><div class="dot"></div><span id="dsText">ready</span></div>
  </div>
  <div style="flex:1;display:flex;overflow:hidden">
    <div style="flex:1;display:flex;flex-direction:column;min-width:0">
      <div class="chat-search hidden" id="chatSearchBar">
        <input type="text" id="chatSearchInput" placeholder="Search messages... (Esc to close)">
        <span class="chat-search-count" id="chatSearchCount"></span>
      </div>
      <div class="chat" id="chat"></div>
      <div class="img-preview-bar" id="imgBar"></div>
      <div class="input-bar">
        <textarea id="inp" rows="1" placeholder="Message Claude..."></textarea>
        <input type="file" id="imgFileInput" accept="image/*" multiple style="display:none" onchange="handleImgFiles(event)">
        <button class="btn-mic" id="attachBtn" onclick="document.getElementById('imgFileInput').click()" title="Attach image" aria-label="Attach image">📎</button>
        <button class="btn-mic" id="micBtn" onclick="toggleVoiceInput()" title="Voice note (Space)" aria-label="Voice note">🎙</button>
        <button class="btn-send" id="sendBtn" onclick="send()">Send</button>
        <button class="btn-stop" id="stopBtn" onclick="interrupt()">Stop</button>
      </div>
    </div>
    <div class="summary-panel hidden" id="summaryPanel">
      <div class="drawer-head">
        <div class="drawer-title-row"><h2>Summary</h2><button onclick="toggleSummary()">&times;</button></div>
      </div>
      <div class="summary-body" id="summaryBody"><div class="drawer-empty">Loading…</div></div>
    </div>
    <div class="drawer hidden" id="jobsDrawer">
      <div class="drawer-head"><div class="drawer-title-row"><h2>Jobs</h2><button onclick="toggleJobs()">&times;</button></div></div>
      <div id="jobsList"></div>
    </div>
    <div class="drawer hidden" id="taskBoard">
      <div class="drawer-head">
        <div class="drawer-title-row"><h2>Tasks</h2><span class="drawer-count" id="taskCount"></span><button onclick="toggleTaskBoard()">&times;</button></div>
        <div class="drawer-filters" id="taskFilters">
          <button class="active" data-tf="actionable" onclick="setTaskFilter('actionable')">Needs input</button>
          <button data-tf="active" onclick="setTaskFilter('active')">Active</button>
          <button data-tf="all" onclick="setTaskFilter('all')">All</button>
          <button class="tk-btn tk-btn-retry" onclick="retryAllBlocked()" title="Retry all blocked tasks">↻ Retry all</button>
        </div>
      </div>
      <div class="drawer-list" id="taskList"><div class="drawer-empty">Loading tasks…</div></div>
    </div>
    <div class="drawer hidden" id="decisionsDrawer">
      <div class="drawer-head">
        <div class="drawer-title-row"><h2>Decisions</h2><span class="drawer-count" id="decisionsCount"></span><button onclick="toggleDecisionsDrawer()">&times;</button></div>
        <div class="drawer-filters" id="decisionsFilters">
          <button class="active" data-dv="timeline" onclick="setDecisionsView('timeline')">Timeline</button>
          <button data-dv="tree" onclick="setDecisionsView('tree')">Tree</button>
          <button data-dv-scope="session" onclick="setDecisionsScope('session')" title="This chat">This chat</button>
          <button data-dv-scope="project" class="active" onclick="setDecisionsScope('project')" title="All chats in this project">Project</button>
        </div>
      </div>
      <div class="drawer-list" id="decisionsList"><div class="drawer-empty">No decisions recorded yet</div></div>
    </div>
    <div class="drawer hidden" id="drawer">
      <div class="drawer-head">
        <div class="drawer-title-row"><h2>Files</h2><span class="drawer-count" id="drawerCount"></span><button onclick="toggleDrawer()">&times;</button></div>
        <input class="drawer-search" id="drawerSearch" type="text" placeholder="Search files..." oninput="renderDrawer()">
        <div class="drawer-filters" id="drawerFilters">
          <button class="active" data-fscope="chat" onclick="setFileScope('chat')" title="Files made in this chat">This chat</button>
          <button data-fscope="project" onclick="setFileScope('project')" title="Files made in any chat in this project">Project</button>
          <span style="width:1px;background:var(--border);margin:0 2px"></span>
          <button class="active" data-ftype="all" onclick="setFileFilter('all')">All</button>
          <button data-ftype="email" onclick="setFileFilter('email')">Emails</button>
          <button data-ftype="document" onclick="setFileFilter('document')">Docs</button>
          <button data-ftype="voice" onclick="setFileFilter('voice')" title="Voice notes recorded in this chat">Voice</button>
          <span style="flex:1"></span>
          <select id="drawerSortSel" class="drawer-sort" onchange="setSortMode(this.value)" title="Sort">
            <option value="newest">Newest</option>
            <option value="oldest">Oldest</option>
            <option value="name">Name</option>
            <option value="type">Type</option>
          </select>
        </div>
      </div>
      <div class="drawer-list" id="drawerList"><div class="drawer-empty">No files yet</div></div>
    </div>
  </div>
</div>

<div class="fab" id="fab" title="Next chat needing attention">
  <span class="fab-icon">🔔</span><span class="fab-count" id="fabCount">0</span>
</div>

<script src="app.js"></script>
<script src="app-modelpicker.js"></script>
<script src="app-sidebar.js"></script>
<script src="app-ws.js"></script>
<script src="app-render.js"></script>
<script src="app-drawer.js"></script>
<script src="app-tasks.js"></script>
<script src="app-jobs.js"></script>
<script src="app-voice.js"></script>
<script src="app-permcards.js"></script>
<script src="app-msg-helpers.js"></script>
<script src="app-status.js"></script>
<script src="app-session-state.js"></script>
<script src="app-input.js"></script>
<script src="app-ui-misc.js"></script>
<script src="app-topbar.js"></script>
<script src="app-bubble-menu.js"></script>
<script src="app-tts.js"></script>
<script src="app-decisions.js"></script>
<script src="app-email-draft.js"></script>

  <!-- Shared Win95 model picker overlay (opened by both desktop topbar btn and mobile overflow btn) -->
  <div id="modelPickerBackdrop" class="win95-backdrop" hidden></div>
  <div id="modelPickerMenu" class="win95-menu" hidden role="menu" aria-label="Choose model">
    <div class="win95-titlebar">
      <span>Choose Model</span>
      <button type="button" class="win95-x" aria-label="Close">✕</button>
    </div>
    <div class="win95-menu-list" id="modelPickerList"></div>
  </div>

</body>

  <!-- Shared Win95 model picker overlay (opened by both desktop topbar btn and mobile overflow btn) -->
</html>
